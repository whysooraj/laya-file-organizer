[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-file-organizer"
version = "1.0.0"
description = "Sub-35ms local file organizer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "laya>=0.3.26",
]

[project.scripts]
laya = "laya_organizer:main"
